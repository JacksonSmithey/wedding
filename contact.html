	<div class="fh5co-section">
		<div class="container">
			<div class="row">
				<div class="col-md-6 col-md-push-6 animate-box">
					<h3>Save Your Spot</h3>
					<span>Please note that plus ones are by invitation only and will be included on your RSVP</span>
					<form action="https://formspree.io/f/mrpbpkoo" method="POST">
						<div class="row form-group">
							<div class="col-md-6">
								<label for="fname">First Name</label>
								<input type="text" id="fname" name="fname" class="form-control" placeholder="Ashley">
							</div>
							<div class="col-md-6">
								<label for="lname">Last Name</label>
								<input type="text" id="lname" name="lname" class="form-control" placeholder="Smithey">
							</div>
						</div>

						<div class="row form-group">
							<div class="col-md-12">
								<label for="email">Email</label>
								<input type="text" id="email" name="email" class="form-control" placeholder="Your email address">
							</div>
						</div>

						<div class="row form-group">
							<div class="col-md-12">
								<label for="numGuests">Number of Guests (Including You)</label>
								<input type="number" id="numGuests" name="numGuests" class="form-control" placeholder="1">
							</div>
						</div>

						<div class="row form-group">
							<div class="col-md-12">
								<label for="message">Message</label>
								<textarea name="message" id="message" name="message" cols="30" rows="10" class="form-control" placeholder="Write us something"></textarea>
							</div>
						</div>
						<div class="form-group">
							<input type="submit" value="RSVP!" class="btn btn-primary">
						</div>
					</form>		
				</div>
				<div class="col-md-5 col-md-pull-5 animate-box">

						</ul>
